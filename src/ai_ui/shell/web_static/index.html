<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><!-- title --></title>
  <link rel="stylesheet" href="shell/shell.css">
  <!-- assets -->
  <!-- Deferred scripts run in document order, so pane initialisers are
       registered before the shell reads them. -->
  <script src="shell/shell.js" defer></script>
</head>
<body>
  <header id="shell-header">
    <h1><!-- title --></h1>
  </header>
  <div id="shell-body">
    <aside id="shell-menu">
      <nav id="shell-modules"><!-- modules --></nav>
      <nav id="shell-details"><!-- details --></nav>
    </aside>
    <div id="shell-main">
      <div id="shell-top"><!-- top --></div>
      <main id="shell-panes"><!-- panes --></main>
    </div>
  </div>
</body>
</html>
