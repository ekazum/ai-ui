[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ui"
version = "0.1.0"
description = "Web shell and runs dashboard for ML experiment records"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["flask", "pydantic>=2", "pyyaml"]

[tool.setuptools.packages.find]
include = ["ai_ui*"]

[tool.setuptools.package-data]
ai_ui = [
    "shell/web_static/*.html",
    "shell/web_static/shell/*",
    "runs/static/*",
    "runs/*.sql",
]
