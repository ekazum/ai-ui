[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ui"
version = "0.3.0"
description = "Web shell and runs dashboard for ML experiment records"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["flask", "pydantic>=2", "pyyaml"]
authors = [{ name = "Eli Kazum", email = "ekazum@gmail.com" }]
keywords = ["machine-learning", "experiment-tracking", "dashboard", "flask", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/ekazum/ai-ui"
Repository = "https://github.com/ekazum/ai-ui"
Issues = "https://github.com/ekazum/ai-ui/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_ui*"]

[tool.setuptools.package-data]
ai_ui = [
    "shell/web_static/*.html",
    "shell/web_static/shell/*",
    "runs/static/*",
    "runs/*.sql",
]
